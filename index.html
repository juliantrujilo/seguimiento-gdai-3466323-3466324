<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento de evidencias y juicios · GDAI 3466323 / 3466324</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --hueso:#F4F2EC; --hueso-dark:#e5e1d4; --card:#ffffff; --borde:#e2ddcc;
  --verde:#018751; --verde-dark:#016a3f; --verde-bg:#e6f5ef; --verde-borde:#b8e4d2;
  --zajuna:#018751; --sofia:#0369a1;
  --texto:#0f172a; --texto-2:#334155; --texto-3:#64748b;
  --ok:#0f7a3d; --ok-bg:#e3f4e9; --aviso:#9a5b00; --aviso-bg:#fdf1d8; --mal:#b42318; --mal-bg:#fde8e6; --neutro:#475569; --neutro-bg:#eef0f3;
  --r-sm:8px; --r-md:14px; --r-lg:18px; --sombra:0 10px 30px -12px rgba(15,23,42,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--hueso);color:var(--texto);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.2}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--borde);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.marca{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--borde);margin-bottom:10px}
.marca b{font-family:'Syne',sans-serif;font-size:15px;display:block}
.marca small{color:var(--texto-3);font-size:11.5px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--verde);color:#fff;display:grid;place-items:center;font-family:'Syne',sans-serif;font-weight:800}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-sm);color:var(--texto-2);font-weight:500;text-align:left}
.nav:hover{background:var(--hueso)}
.nav.activo{background:var(--verde-bg);color:var(--verde-dark);font-weight:600}
.nav svg,.btn svg{width:16px;height:16px;flex:none}
.pie{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.pie small{color:var(--texto-3);font-size:11.5px;padding:0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);font-weight:600;border:1px solid var(--borde);background:var(--card);color:var(--texto-2);text-decoration:none}
.btn:hover{border-color:var(--verde)}
.btn.primario{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.primario:hover{background:var(--verde-dark)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding:22px 28px 60px;min-width:0}
.barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.barra h1{font-size:22px}
.barra p{color:var(--texto-3);font-size:13px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--borde);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;color:var(--texto-2);font-size:13px}
.seg button.activo{background:var(--verde);color:#fff}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.filtros span.rot{color:var(--texto-3);font-size:12.5px;margin-right:2px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--borde);background:var(--card);font-size:12.5px;font-weight:600;color:var(--texto-2)}
.chip.activo{background:var(--texto);border-color:var(--texto);color:#fff}
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--sombra)}
.card h2{font-size:16px;margin-bottom:4px}
.card .sub{color:var(--texto-3);font-size:12.5px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--borde);border-radius:var(--r-md);padding:14px 16px}
.kpi .et{color:var(--texto-3);font-size:12px;font-weight:600}
.kpi .val{font-size:28px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .nota{color:var(--texto-3);font-size:12px}
.rejilla{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:18px}
.leyenda{display:flex;gap:16px;font-size:12px;color:var(--texto-2);margin-bottom:12px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fila-m{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #f0ede3}
.fila-m:first-of-type{border-top:0}
.fila-m .nom{font-weight:600;font-size:13px}
.fila-m .nom small{display:block;color:var(--texto-3);font-weight:400;font-size:11.5px}
.medidor{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:var(--texto-2)}
.medidor + .medidor{margin-top:5px}
.pista{height:8px;background:var(--hueso-dark);border-radius:4px;overflow:hidden}
.pista span{display:block;height:100%;border-radius:4px}
.pista .z{background:var(--zajuna)} .pista .s{background:var(--sofia)}
.medidor b{text-align:right;font-variant-numeric:tabular-nums}
.clic{cursor:pointer}
.clic:hover{background:#faf9f5}
.tabla-caja{overflow:auto;border:1px solid var(--borde);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #f0ede3;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-3);background:#faf9f5;position:sticky;top:0;z-index:2;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.pild{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pild.ok{background:var(--ok-bg);color:var(--ok)} .pild.aviso{background:var(--aviso-bg);color:var(--aviso)}
.pild.mal{background:var(--mal-bg);color:var(--mal)} .pild.neutro{background:var(--neutro-bg);color:var(--neutro)}
.buscador{padding:9px 12px;border:1px solid var(--borde);border-radius:var(--r-sm);font:inherit;min-width:240px;background:var(--card)}
select.buscador{min-width:0}
.matriz td,.matriz th{padding:5px 4px;text-align:center;font-size:11.5px}
.matriz th:first-child,.matriz td:first-child{position:sticky;left:0;background:var(--card);text-align:left;padding-left:12px;white-space:nowrap;z-index:1;border-right:1px solid var(--borde)}
.matriz thead tr:nth-child(2) th{top:31px}
.matriz thead th:first-child{z-index:3;background:#faf9f5}
.matriz th.ev{writing-mode:vertical-rl;transform:rotate(180deg);height:92px;font-size:10.5px;text-transform:none;letter-spacing:0}
.matriz th.grupo{border-left:2px solid var(--hueso-dark);text-transform:none;font-size:11px}
.cel{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:700;font-size:11px}
.cel.A{background:var(--ok-bg);color:var(--ok)} .cel.D{background:var(--mal-bg);color:var(--mal)} .cel.P{background:var(--neutro-bg);color:var(--neutro)}
.vacio{padding:34px 20px;text-align:center;color:var(--texto-3)}
.vacio b{display:block;color:var(--texto);font-size:15px;margin-bottom:4px}
.guia-bloque{margin-bottom:18px}
.guia-bloque h3{font-size:15px;margin:0 0 2px}
details{border-top:1px solid #f0ede3}
details summary{list-style:none;cursor:pointer;padding:10px 0}
details summary::-webkit-details-marker{display:none}
.modal-fondo{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
.modal-fondo.abierto{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);width:min(860px,100%);padding:22px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.modal header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.modal h2{font-size:19px}
.modal .cerrar{font-size:22px;line-height:1;color:var(--texto-3);padding:2px 8px}
.campo{display:block;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--texto-2)}
.campo input,.campo select{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid var(--borde);border-radius:var(--r-sm);font:inherit;background:#fff}
.aviso-caja{padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-top:10px;display:none}
.aviso-caja.ver{display:block}
.aviso-caja.info{background:var(--neutro-bg);color:var(--neutro)} .aviso-caja.ok{background:var(--ok-bg);color:var(--ok)} .aviso-caja.mal{background:var(--mal-bg);color:var(--mal)}
.lista-ev{display:grid;gap:6px;margin:6px 0 14px}
.lista-ev div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 10px;background:#faf9f5;border-radius:var(--r-sm);font-size:13px}
.lista-ev code{font-size:11px;color:var(--texto-3);display:block}
.estado-datos{font-size:12px;color:var(--texto-3)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .marca{border:0;margin:0;padding:4px 8px;width:100%}
  .nav{width:auto;padding:8px 10px}
  .pie{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .pie small{display:none}
  main{padding:16px 14px 50px}
  .fila-m{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca"><div class="logo">G</div><div><b>Seguimiento GDAI</b><small>Fichas 3466323 · 3466324</small></div></div>
    <button class="nav activo" data-vista="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Resumen</button>
    <button class="nav" data-vista="guias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Guías y competencias</button>
    <button class="nav" data-vista="aprendices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Aprendices</button>
    <button class="nav" data-vista="matriz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Matriz de entregas</button>
    <div class="pie">
      <button class="btn primario" id="btnActualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Actualizar datos</button>
      <a class="btn" href="../explorar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>Volver al Hub</a>
      <small id="estadoDatos" class="estado-datos"></small>
    </div>
  </aside>

  <main>
    <div class="barra">
      <div><h1 id="titulo">Resumen</h1><p id="subtitulo"></p></div>
      <div class="seg" id="selFicha"></div>
    </div>
    <div class="filtros" id="filtros"></div>
    <div id="vista"></div>
  </main>
</div>

<div class="modal-fondo" id="modalFondo"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script src="catalogo.js"></script>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
